name: Package and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches packaged version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < packaging/VERSION)"
          tag="${GITHUB_REF_NAME}"
          test "$tag" = "v$version" || {
            echo "Tag $tag must match packaging/VERSION (v$version)"
            exit 1
          }

      - name: Build Mac and Windows packages
        run: packaging/build.sh

      - name: Create app update manifest
        env:
          RELEASE_REPO: ${{ github.repository }}
        run: python3 packaging/make_update.py "Automated release"

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/Survival-LLM-WEB-Enabled-mac.zip \
            dist/Survival-LLM-WEB-Enabled-windows.zip \
            --title "Survival LLM (WEB Enabled) ${GITHUB_REF_NAME#v}" \
            --generate-notes
